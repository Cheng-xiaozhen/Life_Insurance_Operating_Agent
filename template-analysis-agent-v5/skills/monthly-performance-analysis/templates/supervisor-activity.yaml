id: supervisor-activity
version: 4.1.0
title: 主管活动
description: 汇总主管活动人数和活动率，并识别高低机构。
keywords: [主管活动, 主管活动率]
parameters:
  supervisor_activity_high_threshold: {default: 80, description: 主管活动率高位阈值。}
  supervisor_activity_low_threshold: {default: 60, description: 主管活动率低位阈值。}
metrics:
  in_service: {label: 在职主管, formatter: person}
  active_count: {label: 主管活动人数, formatter: person}
  activity_rate: {label: 主管活动率, formatter: pct}
  activity_yoy: {label: 主管活动率同比, formatter: pt, semantic: yoy}
steps:
  - {id: overall_summary, title: 全系统概况, op: summarize, metrics: [in_service, active_count, activity_rate, activity_yoy]}
  - id: activity_rate_classification
    title: 主管活动率机构
    op: classify
    order: source
    bands:
      - {id: high, label: 主管活动率较高机构, metric: activity_rate, operator: gt, threshold_param: supervisor_activity_high_threshold}
      - {id: low, label: 主管活动率偏低机构, metric: activity_rate, operator: lt, threshold_param: supervisor_activity_low_threshold}
narrative_groups:
  - {id: overall, title: 全系统概况, fact_ids: [overall_summary.in_service, overall_summary.active_count, overall_summary.activity_rate, overall_summary.activity_yoy]}
  - {id: classification, title: 主管活动率机构, fact_ids: [activity_rate_classification.high, activity_rate_classification.low]}
