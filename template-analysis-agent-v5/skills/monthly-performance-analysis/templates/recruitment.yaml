id: recruitment
version: 4.1.0
title: 新增
description: 汇总新增、首阳和学历指标，并识别目标、低位及本科占比表现。
keywords: [新增人力, 新增达成, 新增, 增员, 首阳, 本科占比]

parameters:
  recruitment_middle_low_threshold: {default: 80, description: 新增中档下限。}
  recruitment_target_threshold: {default: 100, description: 新增目标阈值。}
  recruitment_low_threshold: {default: 40, description: 新增低位阈值。}
  bachelor_target_threshold: {default: 0, description: 本科占比目标差额阈值。}
  bachelor_excess_threshold: {default: 10, description: 本科占比超额阈值。}

metrics:
  training_count: {label: 新增送训, formatter: person}
  added_count: {label: 新增人数, formatter: person}
  added_rate: {label: 新增达成率, formatter: pct}
  added_yoy: {label: 新增同比, formatter: pct, semantic: yoy}
  first_sun_count: {label: 起聘首阳人数, formatter: person}
  first_sun_rate: {label: 起聘首阳率, formatter: pct}
  college_share: {label: 大专及以上学历占比, formatter: pct}
  college_yoy: {label: 大专及以上学历同比, formatter: pt, semantic: yoy}
  bachelor_share: {label: 本科及以上学历占比, formatter: pct}
  bachelor_gap: {label: 本科占比目标差额, formatter: pt, semantic: gap}

steps:
  - id: overall_summary
    title: 全系统概况
    op: summarize
    metrics: [training_count, added_count, added_rate, added_yoy, first_sun_count, first_sun_rate, college_share, college_yoy, bachelor_share, bachelor_gap]

  - id: recruitment_rate_classification
    title: 新增目标机构
    op: classify
    order: source
    bands:
      - id: middle
        label: 新增中档机构
        conditions:
          match: all
          rules:
            - {metric: added_rate, operator: gt, threshold_param: recruitment_middle_low_threshold}
            - {metric: added_rate, operator: lt, threshold_param: recruitment_target_threshold}
        display_metric: added_rate
      - {id: target_met, label: 新增目标达成机构, metric: added_rate, operator: gte, threshold_param: recruitment_target_threshold}

  - id: recruitment_rate_low
    title: 新增低位机构
    op: classify
    order: source
    bands:
      - {id: low, label: 新增达成率偏低机构, metric: added_rate, operator: lt, threshold_param: recruitment_low_threshold}

  - id: bachelor_classification
    title: 本科占比达标机构
    op: classify
    order: source
    bands:
      - {id: target_met, label: 本科占比目标达成机构, metric: bachelor_gap, operator: gte, threshold_param: bachelor_target_threshold}
      - {id: excess, label: 本科占比超额机构, metric: bachelor_gap, operator: gt, threshold_param: bachelor_excess_threshold}

  - id: bachelor_target_not_met
    title: 本科占比未达标机构
    op: classify
    order: source
    bands:
      - id: not_met
        label: 本科占比目标未达成机构
        conditions:
          match: any
          rules:
            - {metric: bachelor_gap, operator: lt, threshold_param: bachelor_target_threshold}
            - {metric: bachelor_gap, operator: is_missing}
        display_metric: bachelor_gap

signals:
  target_met: recruitment_rate_classification.target_met

narrative_groups:
  - {id: overall, title: 全系统概况, fact_ids: [overall_summary.training_count, overall_summary.added_count, overall_summary.added_rate, overall_summary.added_yoy, overall_summary.first_sun_count, overall_summary.first_sun_rate, overall_summary.college_share, overall_summary.college_yoy, overall_summary.bachelor_share, overall_summary.bachelor_gap]}
  - {id: recruitment, title: 新增目标机构, fact_ids: [recruitment_rate_classification.middle, recruitment_rate_classification.target_met]}
  - {id: recruitment_low, title: 新增低位机构, fact_ids: [recruitment_rate_low.low]}
  - {id: bachelor_met, title: 本科占比达标机构, fact_ids: [bachelor_classification.target_met, bachelor_classification.excess]}
  - {id: bachelor_not_met, title: 本科占比未达标机构, fact_ids: [bachelor_target_not_met.not_met]}
