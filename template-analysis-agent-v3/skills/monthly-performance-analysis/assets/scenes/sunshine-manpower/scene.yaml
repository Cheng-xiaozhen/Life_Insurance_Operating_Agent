scene_id: sunshine-manpower
query_ref: monthly-performance.sunshine-manpower
parameters:
  data_month_name:
    type: string
    required: true
    description: 报告月份，例如5月。
  cutoff_date:
    type: string
    required: true
    description: 数据截止日期，例如5月31日。
  sunshine_high_threshold:
    type: number
    default: 90
    description: 阳光人力达成率高位阈值。
  sunshine_low_threshold:
    type: number
    default: 70
    description: 阳光人力达成率低位阈值。
analysis_intent:
  - 汇总阳光人力、达成率、同比和阳光占比活动。
  - 识别达到高位阈值和低于低位阈值的机构。
steps:
  - id: overall_summary
    type: summarize
    metrics: [sunshine_count, sunshine_rate, sunshine_yoy, sunshine_share]
  - id: sunshine_rate_classification
    type: classify
    metric: sunshine_rate
    display_order: source
    bands:
      - {id: high, operator: gte, threshold_param: sunshine_high_threshold}
      - {id: low, operator: lt, threshold_param: sunshine_low_threshold}
signals: {}
expression:
  style_profile: monthly-operation-report
  example_tags: [summary, threshold-classification]

