scene_id: value
query_ref: monthly-performance.value
parameters:
  data_month_name:
    type: string
    required: true
    description: 报告月份，例如5月。
  cutoff_date:
    type: string
    required: true
    description: 数据截止日期，例如5月31日。
  value_high_threshold:
    type: number
    default: 85
    description: 价值月度达成率较高阈值。
  value_low_threshold:
    type: number
    default: 55
    description: 价值月度达成率较低阈值。
analysis_intent:
  - 汇总价值总量、达成率、同比、年度进度和年度同比。
  - 识别价值达成率较高和较低的机构。
steps:
  - id: overall_summary
    type: summarize
    metrics: [month_amount, month_rate, month_yoy, year_progress, year_yoy]
  - id: month_rate_classification
    type: classify
    metric: month_rate
    display_order: source
    bands:
      - {id: high, operator: gt, threshold_param: value_high_threshold}
      - {id: low, operator: lt, threshold_param: value_low_threshold}
signals: {}
expression:
  style_profile: monthly-operation-report
  example_tags: [summary, threshold-classification]
