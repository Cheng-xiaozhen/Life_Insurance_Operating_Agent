scene_id: active-manpower
query_ref: monthly-performance.active-manpower
parameters:
  data_month_name:
    type: string
    required: true
    description: 报告月份，例如5月。
  cutoff_date:
    type: string
    required: true
    description: 数据截止日期，例如5月31日。
  activity_high_threshold:
    type: number
    default: 90
    description: 活动人力达成率较高阈值。
  activity_target_threshold:
    type: number
    default: 100
    description: 活动人力目标阈值。
  activity_low_threshold:
    type: number
    default: 60
    description: 活动人力达成率较低阈值。
analysis_intent:
  - 汇总全系统活动人力、达成率和同比。
  - 识别高于较高阈值、达到目标和低于较低阈值的机构。
steps:
  - id: overall_summary
    type: summarize
    metrics: [activity_count, activity_rate, activity_yoy]
  - id: activity_rate_classification
    type: classify
    metric: activity_rate
    display_order: source
    bands:
      - {id: high, operator: gt, threshold_param: activity_high_threshold}
      - {id: target_met, operator: gte, threshold_param: activity_target_threshold}
      - {id: low, operator: lt, threshold_param: activity_low_threshold}
signals:
  target_met:
    from: {step: activity_rate_classification, band: target_met}
expression:
  style_profile: monthly-operation-report
  example_tags: [summary, threshold-classification]

