id: monthly-performance.value
version: 1.0.0
binding_id: value
description: 查询机构及全系统月度价值和年度价值进度。
parameters:
  data_month_name:
    type: string
    required: true
    description: CSV动态月份列名称，例如5月。
output_schema: canonical.monthly-performance.value.v1
grain: organization
handler: csv
handler_ref: template_analysis_agent.query.CsvDataAdapter
profile_id: value
source:
  kind: local_binding
  owner: monthly-performance-analysis
  contains_sensitive_data: false
permissions:
  classification: internal
  required_scopes: [monthly-performance:read]
required: true
timeout_ms: 30000
