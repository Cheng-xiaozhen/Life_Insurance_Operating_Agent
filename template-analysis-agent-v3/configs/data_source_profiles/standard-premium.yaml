profile:
  id: standard-premium
  version: 1.0.0
  encoding: utf-8-sig
dimensions:
  row_label: {column: 片区, type: string}
  organization: {column: 机构, type: string}
row_sets:
  total: {field: row_label, operator: eq, value: 全系统}
  details: {organization_field: organization}
metrics:
  month_amount: {column: "${data_month_name}达成", type: number}
  month_rate: {column: "${data_month_name}达成率", type: number}
  month_yoy: {column: "${data_month_name}同比", type: number}
  year_amount: {column: 全年标保达成, type: number}
  year_progress: {column: 全年进度, type: number}
  year_yoy: {column: 全年同比, type: number}

