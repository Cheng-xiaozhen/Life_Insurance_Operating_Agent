id: value
title: 价值
description: 分析月度价值达成、同比表现和年度进度，识别价值达成明显领先与落后的机构。

parameters:
  high_rate: 85
  low_rate: 55

metrics:
  month_amount: {label: 月度价值达成, unit: 万}
  month_rate: {label: 月度价值达成率}
  month_yoy: {label: 月度价值同比}
  year_progress: {label: 全年价值进度}
  year_yoy: {label: 全年价值同比}

analysis:
  - id: overall
    type: summary
    title: 全系统概况
    fields:
      - month_amount
      - month_rate
      - month_yoy
      - year_progress
      - year_yoy

  - id: high_month_rate
    type: select
    title: 月度价值达成率高于 ${high_rate}% 的机构
    where: {field: month_rate, operator: ">", value: "${high_rate}"}
    order_by: {field: month_rate, direction: desc}
    display_field: month_rate

  - id: low_month_rate
    type: select
    title: 月度价值达成率低于 ${low_rate}% 的机构
    where: {field: month_rate, operator: "<", value: "${low_rate}"}
    order_by: {field: month_rate, direction: asc}
    display_field: month_rate

narrative:
  objective: 概括全系统价值表现，并指出月度价值达成率明显领先或落后的机构。
  style: 使用简洁的经营分析语言，先整体、后机构；只引用执行结果中的数字。

