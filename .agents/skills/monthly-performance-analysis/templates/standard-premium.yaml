id: standard-premium
version: 4.1.0
title: 标保
description: 汇总月度标保和年度进度，并按历史月报阈值识别机构表现。
keywords: [标保达成, 标保, 标准保费, 标保排名, 全年标保进度]

parameters:
  monthly_high_threshold: {default: 70, description: 月度标保高位阈值。}
  monthly_target_threshold: {default: 100, description: 月度标保目标阈值。}
  monthly_low_threshold: {default: 50, description: 月度标保低位阈值。}
  monthly_very_low_threshold: {default: 5, description: 月度标保严重低位阈值。}
  yearly_high_threshold: {default: 60, description: 年度进度高位阈值。}
  yearly_very_high_threshold: {default: 80, description: 年度进度突出阈值。}
  yearly_low_threshold: {default: 45, description: 年度进度低位阈值。}

metrics:
  month_amount: {label: 月度标保达成, formatter: wan}
  month_rate: {label: 月度标保达成率, formatter: pct}
  month_yoy: {label: 月度标保同比, formatter: pct, semantic: yoy}
  year_amount: {label: 全年标保达成, formatter: wan}
  year_progress: {label: 全年标保进度, formatter: pct}
  year_yoy: {label: 全年标保同比, formatter: pct, semantic: yoy}

steps:
  - id: overall_summary
    title: 全系统概况
    op: summarize
    metrics: [month_amount, month_rate, month_yoy, year_amount, year_progress, year_yoy]

  - id: monthly_rate_classification
    title: 月度达成机构
    op: classify
    order: source
    bands:
      - {id: high, label: 月度标保达成率较高机构, metric: month_rate, operator: gt, threshold_param: monthly_high_threshold}
      - {id: target_met, label: 月度标保目标达成机构, metric: month_rate, operator: gte, threshold_param: monthly_target_threshold}
      - {id: low, label: 月度标保达成率偏低机构, metric: month_rate, operator: lt, threshold_param: monthly_low_threshold}
      - {id: very_low, label: 月度标保达成率严重偏低机构, metric: month_rate, operator: lt, threshold_param: monthly_very_low_threshold}

  - id: yearly_progress_classification
    title: 年度进度机构
    op: classify
    order: source
    bands:
      - {id: high, label: 全年标保进度较高机构, metric: year_progress, operator: gt, threshold_param: yearly_high_threshold}
      - {id: very_high, label: 全年标保进度突出机构, metric: year_progress, operator: gt, threshold_param: yearly_very_high_threshold}
      - {id: low, label: 全年标保进度偏低机构, metric: year_progress, operator: lt, threshold_param: yearly_low_threshold}

signals:
  target_met: monthly_rate_classification.target_met
  severe_low: monthly_rate_classification.very_low

narrative_groups:
  - id: overall
    title: 全系统概况
    fact_ids:
      - overall_summary.month_amount
      - overall_summary.month_rate
      - overall_summary.month_yoy
      - overall_summary.year_amount
      - overall_summary.year_progress
      - overall_summary.year_yoy
  - id: monthly
    title: 月度达成机构
    fact_ids:
      - monthly_rate_classification.high
      - monthly_rate_classification.target_met
      - monthly_rate_classification.low
      - monthly_rate_classification.very_low
  - id: yearly
    title: 年度进度机构
    fact_ids:
      - yearly_progress_classification.high
      - yearly_progress_classification.very_high
      - yearly_progress_classification.low
