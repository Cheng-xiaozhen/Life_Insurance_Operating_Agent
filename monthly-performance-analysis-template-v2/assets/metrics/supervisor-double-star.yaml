catalog:
  id: supervisor-double-star
  version: 1.0.0
  title: 主管双星候选指标
  dataset: supervisor_double_star

dimensions:
  row_label:
    column: 分组
    type: string
  organization:
    column: 机构
    type: string

row_sets:
  total:
    field: row_label
    operator: eq
    value: 全系统
  details:
    organization_field: organization

metrics:
  in_service:
    label: 在职主管
    column: 在职主管
    type: number
    unit: person
    formatter: person
    operations: [summarize]
  double_star_count:
    label: 主管双星人数
    column: 双星人数
    type: number
    unit: person
    formatter: person
    operations: [summarize]
  double_star_rate:
    label: 主管双星率
    column: 双星率
    type: number
    unit: pct
    formatter: pct
    operations: [summarize, classify]
  double_star_yoy:
    label: 主管双星率同比
    column: 双星率同比
    type: number
    unit: pt
    formatter: yoy_pt_phrase
    threshold_formatter: pt
    operations: [summarize, classify]
